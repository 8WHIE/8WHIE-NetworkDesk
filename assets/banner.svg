<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Topology Nodes Graphic on Right -->
  <g transform="translate(820, 40)">
    <!-- Circuit connection lines -->
    <path d="M 50 140 L 140 70 L 250 110 L 310 200 L 220 250 L 100 230 Z" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-dasharray="6,6" />
    <path d="M 140 70 L 220 250 M 50 140 L 250 110" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.25" />

    <!-- Node circles -->
    <circle cx="140" cy="70" r="16" fill="#0b1120" stroke="#06b6d4" stroke-width="3" />
    <circle cx="140" cy="70" r="6" fill="#38bdf8" />

    <circle cx="250" cy="110" r="20" fill="#0b1120" stroke="#6366f1" stroke-width="3" />
    <circle cx="250" cy="110" r="8" fill="#818cf8" />

    <circle cx="310" cy="200" r="14" fill="#0b1120" stroke="#10b981" stroke-width="2.5" />
    <circle cx="310" cy="200" r="5" fill="#34d399" />

    <circle cx="220" cy="250" r="18" fill="#0b1120" stroke="#38bdf8" stroke-width="3" />
    <circle cx="220" cy="250" r="7" fill="#0284c7" />

    <circle cx="100" cy="230" r="15" fill="#0b1120" stroke="#8b5cf6" stroke-width="2.5" />
    <circle cx="100" cy="230" r="5" fill="#a78bfa" />

    <circle cx="50" cy="140" r="17" fill="#0b1120" stroke="#06b6d4" stroke-width="3" />
    <circle cx="50" cy="140" r="6" fill="#22d3ee" />
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(80, 85)">
    <!-- Badge -->
    <rect width="180" height="28" rx="14" fill="#0f172a" stroke="#1e293b" />
    <circle cx="16" cy="14" r="4" fill="#10b981" />
    <text x="28" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">OPEN SOURCE • .NET 8</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      8WHIE <tspan fill="url(#cyanIndigo)">Network Toolkit</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="116" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      Modern Network Diagnostics &amp; Administration Toolkit
    </text>

    <!-- Pills / Modules -->
    <g transform="translate(0, 142)">
      <rect width="80" height="26" rx="6" fill="#1e293b" />
      <text x="40" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ PING</text>

      <rect x="90" width="110" height="26" rx="6" fill="#1e293b" />
      <text x="145" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔍 DNS TOOLKIT</text>

      <rect x="210" width="115" height="26" rx="6" fill="#1e293b" />
      <text x="267" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔢 SUBNET CALC</text>

      <rect x="335" width="105" height="26" rx="6" fill="#1e293b" />
      <text x="387" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ PORT PROBE</text>

      <rect x="450" width="120" height="26" rx="6" fill="#1e293b" />
      <text x="510" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔌 CONNECTIONS</text>
    </g>

    <!-- Author & Social Bar -->
    <text x="0" y="202" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">
      Created by <tspan fill="#f1f5f9" font-weight="600">Aryan Thakur (8WHIE)</tspan> • Free &amp; Privacy-Conscious
    </text>
  </g>
</svg>
